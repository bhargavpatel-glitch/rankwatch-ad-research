[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

# If backend is hosted separately (e.g. on Render or Railway), forward API calls:
# [[redirects]]
#   from = "/api/*"
#   to = "https://YOUR-BACKEND.onrender.com/api/:splat"
#   status = 200
#   force = true

# SPA client-side routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
